<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NOVA Mini</title>
  <style>
    :root{color-scheme:dark;--bg:#10140d;--surface:#171d13;--surface-2:#24301a;--line:#3b4a2b;--text:#f4f7ee;--muted:#aab49b;--quiet:#7f8d70;--lime:#c8f43d;--orange:#ed714b;--ease:cubic-bezier(.16,1,.3,1)}
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,sans-serif}button{font:inherit}
    .shell{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:10px 12px 12px;background:radial-gradient(circle at 5% 0,#334421,transparent 42%),var(--bg)}
    .topbar{display:flex;align-items:center;justify-content:space-between;direction:ltr;min-height:28px;user-select:none}.drag{display:flex;align-items:center;gap:9px;flex:1;height:30px;cursor:grab}.drag:active{cursor:grabbing}.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 14px var(--lime)}.brand{font:700 11px/1 Consolas,monospace;letter-spacing:.19em;color:var(--lime)}.live{font:600 9px/1 Consolas,monospace;letter-spacing:.08em;color:var(--quiet);border:1px solid var(--line);border-radius:99px;padding:5px 7px}
    .window-actions{display:flex;gap:4px}.window-actions button{width:28px;height:28px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;transition:transform 180ms var(--ease),background 180ms var(--ease),color 180ms var(--ease)}.window-actions button:hover{background:var(--surface-2);color:var(--text);transform:translateY(-1px)}.window-actions button:last-child:hover{color:var(--orange)}
    .stage{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.art-wrap{position:relative;width:min(65vw,210px);aspect-ratio:1;border-radius:22px;padding:6px;background:linear-gradient(145deg,var(--line),transparent 35%);box-shadow:0 14px 32px #0008}.art-wrap:before{content:"";position:absolute;inset:9%;border-radius:50%;background:var(--lime);filter:blur(24px);opacity:.11;transition:opacity 420ms var(--ease)}.art-wrap.playing:before{opacity:.26}
    .art{position:relative;width:100%;height:100%;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,var(--surface-2),var(--surface));font-size:60px}.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 220ms var(--ease)}.art.has-image img{opacity:1}.art:after{content:"";position:absolute;inset:55% 0 0;background:linear-gradient(transparent,#080b06cc);pointer-events:none}
    .eq{position:absolute;z-index:2;bottom:16px;left:16px;display:flex;align-items:flex-end;gap:3px;height:22px;direction:ltr}.eq i{width:3px;border-radius:4px;background:var(--lime);height:8px;animation:equalize 900ms ease-in-out infinite alternate paused}.playing .eq i{animation-play-state:running}.eq i:nth-child(2){height:16px;animation-delay:-240ms}.eq i:nth-child(3){height:11px;animation-delay:-510ms}.eq i:nth-child(4){height:20px;animation-delay:-130ms}.eq i:nth-child(5){height:13px;animation-delay:-380ms}@keyframes equalize{to{transform:scaleY(.35)}}
    .art-tag{position:absolute;z-index:3;right:16px;bottom:15px;font:700 9px/1 Consolas,monospace;letter-spacing:.13em;color:var(--bg);background:var(--lime);border-radius:6px;padding:5px 7px}.track-info{width:100%;text-align:right;padding:0 4px}.title{font-size:18px;font-weight:750;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subtitle{margin-top:5px;color:var(--muted);font:11px/1.4 Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .transport{display:grid;gap:8px}.progress-area{display:grid;gap:5px;direction:ltr}.bar{position:relative;height:5px;border-radius:99px;background:var(--line);cursor:pointer}.bar:hover{height:7px}.fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit;background:var(--lime);box-shadow:0 0 10px #c8f43d66;transition:width 80ms linear}.thumb{position:absolute;top:50%;left:0;width:11px;height:11px;border:3px solid var(--bg);border-radius:50%;background:var(--lime);transform:translate(-50%,-50%);opacity:0;transition:opacity 160ms var(--ease)}.bar:hover .thumb{opacity:1}.times{display:flex;justify-content:space-between;color:var(--quiet);font:9px Consolas,monospace}
    .controls{display:flex;align-items:center;justify-content:center;gap:12px;direction:ltr}.control{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);cursor:pointer;transition:transform 180ms var(--ease),border-color 180ms var(--ease),background 180ms var(--ease)}.control:hover{transform:translateY(-2px);border-color:var(--lime);background:var(--surface-2)}.control:active{transform:translateY(0) scale(.95)}.control:focus-visible,.window-actions button:focus-visible,.bar:focus-visible{outline:2px solid var(--lime);outline-offset:3px}.control svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}#toggle{width:58px;height:58px;border:0;border-radius:18px;background:var(--lime);color:var(--bg);box-shadow:0 10px 26px oklch(90% .22 122 / .2)}#toggle:hover{background:oklch(94% .17 122);border-color:transparent;box-shadow:0 14px 32px oklch(90% .22 122 / .32)}#toggle svg{width:21px;height:21px;fill:currentColor;stroke:none}
    .volume{display:grid;grid-template-columns:18px 1fr 30px;align-items:center;gap:6px;direction:ltr}.volume svg{width:15px;height:15px;fill:var(--muted)}.volume input{width:100%;accent-color:var(--lime);height:14px}.volval{color:var(--muted);font:9px Consolas,monospace;text-align:right}.hint{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--quiet);font:9px Consolas,monospace;direction:rtl}.key{border:1px solid var(--line);border-radius:4px;padding:2px 4px;color:var(--muted);background:var(--surface)}
    @media(max-height:430px){.shell{gap:7px;padding:7px 10px}.stage{display:grid;grid-template-columns:125px 1fr;align-items:center;gap:12px}.art-wrap{width:125px}.track-info{min-width:0}.hint{display:none}.transport{gap:5px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="drag" data-tauri-drag-region aria-label="جابه‌جایی پنجره"><span class="brand-dot"></span><span class="brand">NOVA MINI</span><span class="live">ON DESKTOP</span></div><div class="window-actions"><button id="close" aria-label="بستن پنجره" title="بستن">×</button></div></header>
    <section class="stage"><div class="art-wrap" id="artWrap"><div class="art" id="cover"><span id="fallback">🎵</span><img id="coverImage" alt=""><div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><span class="art-tag" id="format">NOVA</span></div></div><div class="track-info"><div class="title" id="title">آهنگی انتخاب نشده</div><div class="subtitle" id="sub">کتابخانهٔ NOVA</div></div></section>
    <section class="transport"><div class="progress-area"><div class="bar" id="bar" role="slider" tabindex="0" aria-label="موقعیت آهنگ" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div><div class="thumb" id="thumb"></div></div><div class="times"><span id="now">00:00</span><span id="duration">00:00</span></div></div><div class="controls"><button class="control" data-cmd="prev" aria-label="آهنگ قبلی" title="قبلی"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 6 9 12l9 6V6Z"/></svg></button><button class="control" id="toggle" data-cmd="toggle" aria-label="پخش یا مکث" title="پخش / مکث"><svg id="playIcon" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></svg></button><button class="control" data-cmd="next" aria-label="آهنگ بعدی" title="بعدی"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 6l9 6-9 6V6Z"/></svg></button></div><label class="volume"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l8 4V5Zm5 3a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg><input id="volume" type="range" min="0" max="1" step=".01" value=".8" aria-label="بلندی صدا"><span class="volval" id="volval">80%</span></label><div class="hint"><span class="key">Space</span><span>پخش / مکث</span><span>•</span><span class="key">← →</span><span>قبلی / بعدی</span></div></section>
  </main>
  <script>
    (()=>{const T=window.__TAURI__, $=id=>document.getElementById(id);let state={};const fmt=n=>{n=Number(n)||0;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0')};const emit=(type,value)=>T?.event?.emit('nova-mini-command',{type,value});const close=async()=>{try{await T?.core?.invoke?.('close_mini_player')}catch{window.close()}};const paint=s=>{state=s||{};$('title').textContent=s.title||'آهنگی انتخاب نشده';$('sub').textContent=s.subtitle||'کتابخانهٔ NOVA';$('now').textContent=fmt(s.current);$('duration').textContent=fmt(s.duration);const ratio=s.duration?Math.max(0,Math.min(1,s.current/s.duration)):0;$('fill').style.width=ratio*100+'%';$('thumb').style.left=ratio*100+'%';$('bar').setAttribute('aria-valuenow',String(Math.round(ratio*100)));$('volume').value=Number.isFinite(s.volume)?s.volume:.8;$('volval').textContent=Math.round($('volume').value*100)+'%';$('artWrap').classList.toggle('playing',!!s.playing);$('playIcon').innerHTML=s.playing?'<path d="M7 5h3v14H7zM14 5h3v14h-3z"/>':'<path d="m8 5 11 7-11 7V5Z"/>';const ext=(s.title||'').split('.').pop().toUpperCase();$('format').textContent=ext.length<6?ext:'NOVA';const image=$('coverImage'),cover=$('cover'),valid=typeof s.cover==='string'&&/^(data:|blob:|asset:|http)/i.test(s.cover);if(valid){if(image.src!==s.cover)image.src=s.cover;cover.classList.add('has-image');$('fallback').hidden=true}else{image.removeAttribute('src');cover.classList.remove('has-image');$('fallback').hidden=false}};if(T?.event?.listen){T.event.listen('nova-player-state',e=>paint(e.payload));T.event.emit('nova-mini-ready')}else $('sub').textContent='ارتباط با پلیر برقرار نشد';$('close').onclick=close;document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>emit(b.dataset.cmd));$('bar').onclick=e=>{if(!state.duration)return;const r=e.currentTarget.getBoundingClientRect();emit('seek',Math.max(0,Math.min(state.duration,(e.clientX-r.left)/r.width*state.duration)))};$('bar').onkeydown=e=>{if(!state.duration)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();emit('seek',Math.max(0,Math.min(state.duration,(state.current||0)+(e.key==='ArrowRight'?5:-5))))}};$('volume').oninput=e=>{emit('volume',Number(e.target.value));$('volval').textContent=Math.round(e.target.value*100)+'%'};document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='Escape')close();if(e.code==='Space'){e.preventDefault();emit('toggle')}if(e.code==='ArrowLeft')emit('prev');if(e.code==='ArrowRight')emit('next')})})();
  </script>
</body>
</html>
