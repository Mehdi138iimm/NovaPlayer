<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NOVA Mini</title>
  <style>
    :root{color-scheme:dark;--bg:#0d0d12;--card:#131318;--stage:#0a0a0e;--line:#26262e;--text:#f2f2f7;--muted:#8b8b98;--quiet:#6a6a76;--neon:#c8ff00;--neon-soft:rgba(200,255,0,.14);--ease:cubic-bezier(.16,1,.3,1)}
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,sans-serif}button{font:inherit}
    .shell{height:100%;display:grid;grid-template-rows:auto 1fr auto auto auto;gap:10px;padding:12px 14px 14px;background:radial-gradient(circle at 12% -6%,rgba(200,255,0,.07),transparent 46%),radial-gradient(circle at 110% 110%,rgba(70,90,160,.10),transparent 52%),var(--card)}

    /* ── top bar ── */
    .topbar{display:flex;align-items:center;justify-content:space-between;direction:ltr;min-height:28px;user-select:none}
    .drag{display:flex;align-items:center;gap:9px;flex:1;height:30px;cursor:grab}.drag:active{cursor:grabbing}
    .brand-dot{width:8px;height:8px;border-radius:50%;background:var(--neon);box-shadow:0 0 14px var(--neon)}
    .brand{font:700 11px/1 Consolas,monospace;letter-spacing:.19em;color:var(--neon)}
    .live{font:600 9px/1 Consolas,monospace;letter-spacing:.08em;color:var(--quiet);border:1px solid var(--line);border-radius:99px;padding:5px 7px}
    .window-actions{display:flex;gap:4px}
    .window-actions button{width:28px;height:28px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;transition:background .18s var(--ease),color .18s var(--ease)}
    .window-actions button:hover{background:var(--line);color:var(--text)}
    .window-actions button:focus-visible{outline:2px solid var(--neon);outline-offset:2px}

    /* ── vinyl stage ── */
    .stage{position:relative;min-height:0;display:grid;place-items:center;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,#101016,var(--stage));overflow:hidden}
    .stage::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(90,110,200,.10),transparent 60%);pointer-events:none}
    .vinyl{position:relative;width:min(58%,210px);aspect-ratio:1}
    .vinyl::before{content:"";position:absolute;inset:-14%;border-radius:50%;background:var(--neon);filter:blur(30px);opacity:.08;transition:opacity .4s var(--ease)}
    .playing .vinyl::before{opacity:.2}
    .vinyl-disc{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,#1a1a21 0 2px,#0a0a0f 2px 4.5px);box-shadow:0 18px 40px #000c,inset 0 0 0 1px #ffffff14;animation:vinylSpin 6s linear infinite;animation-play-state:paused}
    .playing .vinyl-disc{animation-play-state:running}
    @keyframes vinylSpin{to{transform:rotate(360deg)}}
    .vinyl-sheen{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 210deg,transparent 0deg,#ffffff0f 24deg,transparent 60deg,transparent 180deg,#ffffff09 204deg,transparent 240deg);pointer-events:none}
    .vinyl-label{position:absolute;inset:31%;border-radius:50%;display:grid;place-items:center;background:var(--neon);box-shadow:inset 0 0 0 2px #00000030,0 0 22px rgba(200,255,0,.35);overflow:hidden}
    .vinyl-label img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .vinyl-label .note{font-size:26px;filter:grayscale(1) brightness(.15)}
    .vinyl-label.has-image .note{display:none}
    .vinyl-label::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:var(--stage);transform:translate(-50%,-50%);box-shadow:0 0 0 2px #00000055}
    .hifi{position:absolute;top:12px;right:12px;z-index:3;font:700 9px/1 Consolas,monospace;letter-spacing:.14em;color:var(--neon);background:#0a0a0ecc;border:1px solid var(--line);border-radius:6px;padding:5px 7px}
    .eq{position:absolute;z-index:3;bottom:12px;left:12px;display:flex;align-items:flex-end;gap:3px;height:22px;direction:ltr}
    .eq i{width:3px;border-radius:4px;background:var(--neon);height:8px;animation:equalize 900ms ease-in-out infinite alternate paused}
    .playing .eq i{animation-play-state:running}
    .eq i:nth-child(2){height:16px;animation-delay:-240ms}.eq i:nth-child(3){height:11px;animation-delay:-510ms}.eq i:nth-child(4){height:20px;animation-delay:-130ms}.eq i:nth-child(5){height:13px;animation-delay:-380ms}
    @keyframes equalize{to{transform:scaleY(.35)}}

    /* ── track meta ── */
    .meta{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:0 6px;min-height:44px}
    .title{font-size:17px;font-weight:750;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    .lyric{color:var(--neon);font-size:11px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;opacity:.85}
    .lyric.sub{color:var(--muted);font-family:Consolas,monospace;font-size:10.5px;letter-spacing:.04em}

    /* ── transport ── */
    .transport{display:grid;gap:10px}
    .progress-area{display:grid;gap:5px;direction:ltr}
    .bar{position:relative;height:5px;border-radius:99px;background:var(--line);cursor:pointer;transition:height .15s}
    .bar:hover{height:7px}
    .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit;background:var(--neon);box-shadow:0 0 10px #c8ff0a66;transition:width .1s linear}
    .thumb{position:absolute;top:50%;left:0;width:12px;height:12px;border:3px solid var(--card);border-radius:50%;background:var(--neon);transform:translate(-50%,-50%);box-shadow:0 0 8px #c8ff0a88}
    .times{display:flex;justify-content:space-between;color:var(--quiet);font:9px Consolas,monospace}
    .controls{display:flex;align-items:center;justify-content:center;gap:10px;direction:ltr}
    .control{position:relative;width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:13px;background:#17171d;color:var(--text);cursor:pointer;transition:transform .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease)}
    .control:hover{transform:translateY(-2px);border-color:var(--neon)}
    .control:active{transform:translateY(0) scale(.95)}
    .control:focus-visible,.bar:focus-visible{outline:2px solid var(--neon);outline-offset:3px}
    .control svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .control.ghost{background:transparent;border-color:transparent;color:var(--muted)}
    .control.ghost:hover{color:var(--text)}
    .control.ghost.on{color:var(--neon)}
    .control.ghost.on::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;border-radius:50%;background:var(--neon);transform:translateX(-50%)}
    .control .rep-one{position:absolute;top:4px;right:5px;font:700 8px/1 Consolas,monospace;color:var(--neon)}
    #toggle{width:56px;height:56px;border:0;border-radius:18px;background:var(--neon);color:#0d0d12;box-shadow:0 10px 26px rgba(200,255,0,.22)}
    #toggle:hover{box-shadow:0 14px 32px rgba(200,255,0,.34);border-color:transparent}
    #toggle svg{width:21px;height:21px;fill:currentColor;stroke:none}

    /* ── volume ── */
    .volume{display:grid;grid-template-columns:16px 1fr 30px;align-items:center;gap:8px;direction:ltr;padding:0 4px}
    .volume svg{width:14px;height:14px;fill:var(--muted)}
    .volume input{width:100%;accent-color:var(--neon);height:14px}
    .volval{color:var(--quiet);font:9px Consolas,monospace;text-align:right}

    @media(max-height:480px){.shell{gap:7px}.vinyl{width:min(46%,150px)}.meta{min-height:38px}.title{font-size:15px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="drag" data-tauri-drag-region aria-label="جابه‌جایی پنجره"><span class="brand-dot"></span><span class="brand">NOVA MINI</span><span class="live">ON DESKTOP</span></div><div class="window-actions"><button id="close" aria-label="بستن پنجره" title="بستن">×</button></div></header>

    <section class="stage" id="stage">
      <div class="vinyl" id="vinyl">
        <div class="vinyl-disc"></div>
        <div class="vinyl-sheen" aria-hidden="true"></div>
        <div class="vinyl-label" id="label"><img id="coverImage" alt="" hidden><span class="note" id="labelNote">🎵</span></div>
      </div>
      <span class="hifi" id="format">HI-FI</span>
      <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    </section>

    <div class="meta">
      <div class="title" id="title">آهنگی انتخاب نشده</div>
      <div class="lyric sub" id="lyric">کتابخانهٔ NOVA</div>
    </div>

    <section class="transport">
      <div class="progress-area">
        <div class="bar" id="bar" role="slider" tabindex="0" aria-label="موقعیت آهنگ" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div><div class="thumb" id="thumb"></div></div>
        <div class="times"><span id="now">00:00</span><span id="duration">00:00</span></div>
      </div>
      <div class="controls">
        <button class="control ghost" id="shuffleBtn" data-cmd="shuffle" aria-label="پخش تصادفی" title="تصادفی" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
        <button class="control" data-cmd="prev" aria-label="آهنگ قبلی" title="قبلی"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 6 9 12l9 6V6Z"/></svg></button>
        <button class="control" id="toggle" data-cmd="toggle" aria-label="پخش یا مکث" title="پخش / مکث"><svg id="playIcon" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></svg></button>
        <button class="control" data-cmd="next" aria-label="آهنگ بعدی" title="بعدی"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 6l9 6-9 6V6Z"/></svg></button>
        <button class="control ghost" id="repeatBtn" data-cmd="repeat" aria-label="تکرار" title="تکرار" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M7 22l-4-4 4-4M3 12h18M21 12a9 9 0 0 1-9 9M3 12a9 9 0 0 1 9-9"/></svg><span class="rep-one" id="repOne" hidden>1</span></button>
      </div>
    </section>

    <label class="volume"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l8 4V5Zm5 3a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg><input id="volume" type="range" min="0" max="1" step=".01" value=".8" aria-label="بلندی صدا"><span class="volval" id="volval">80%</span></label>
  </main>
  <script>
    (()=>{
      const T=window.__TAURI__,$=id=>document.getElementById(id);let state={};
      const fmt=n=>{n=Number(n)||0;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0')};
      const emit=(type,value)=>T?.event?.emit('nova-mini-command',{type,value});
      const close=async()=>{try{await T?.core?.invoke?.('close_mini_player')}catch{window.close()}};
      const paint=s=>{
        state=s||{};
        $('title').textContent=s.title||'آهنگی انتخاب نشده';
        const lyric=(s.lyric||'').trim();
        $('lyric').textContent=lyric||s.subtitle||'کتابخانهٔ NOVA';
        $('lyric').classList.toggle('sub',!lyric);
        $('now').textContent=fmt(s.current);$('duration').textContent=fmt(s.duration);
        const ratio=s.duration?Math.max(0,Math.min(1,s.current/s.duration)):0;
        $('fill').style.width=ratio*100+'%';$('thumb').style.left=ratio*100+'%';
        $('bar').setAttribute('aria-valuenow',String(Math.round(ratio*100)));
        $('volume').value=Number.isFinite(s.volume)?s.volume:.8;
        $('volval').textContent=Math.round($('volume').value*100)+'%';
        $('stage').classList.toggle('playing',!!s.playing);
        $('playIcon').innerHTML=s.playing?'<path d="M7 5h3v14H7zM14 5h3v14h-3z"/>':'<path d="m8 5 11 7-11 7V5Z"/>';
        const ext=(s.title||'').split('.').pop().toUpperCase();
        $('format').textContent=/\.[A-Z0-9]{2,5}$/.test((s.title||'').toUpperCase())?ext:'HI-FI';
        const sh=$('shuffleBtn'),rp=$('repeatBtn');
        sh.classList.toggle('on',!!s.shuffle);sh.setAttribute('aria-pressed',String(!!s.shuffle));
        const repOn=!!s.repeat&&s.repeat!=='off';
        rp.classList.toggle('on',repOn);rp.setAttribute('aria-pressed',String(repOn));
        $('repOne').hidden=s.repeat!=='one';
        const image=$('coverImage'),label=$('label'),valid=typeof s.cover==='string'&&/^(data:|blob:|asset:|http)/i.test(s.cover);
        if(valid){if(image.src!==s.cover)image.src=s.cover;image.hidden=false;label.classList.add('has-image')}
        else{image.removeAttribute('src');image.hidden=true;label.classList.remove('has-image')}
      };
      if(T?.event?.listen){T.event.listen('nova-player-state',e=>paint(e.payload));T.event.emit('nova-mini-ready')}
      else $('lyric').textContent='ارتباط با پلیر برقرار نشد';
      $('close').onclick=close;
      document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>emit(b.dataset.cmd));
      $('bar').onclick=e=>{if(!state.duration)return;const r=e.currentTarget.getBoundingClientRect();emit('seek',Math.max(0,Math.min(state.duration,(e.clientX-r.left)/r.width*state.duration)))};
      $('bar').onkeydown=e=>{if(!state.duration)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();emit('seek',Math.max(0,Math.min(state.duration,(state.current||0)+(e.key==='ArrowRight'?5:-5))))}};
      $('volume').oninput=e=>{emit('volume',Number(e.target.value));$('volval').textContent=Math.round(e.target.value*100)+'%'};
      document.addEventListener('keydown',e=>{
        if(e.target.matches('input,textarea'))return;
        if(e.key==='Escape')close();
        if(e.code==='Space'){e.preventDefault();emit('toggle')}
        if(e.code==='ArrowLeft')emit('prev');
        if(e.code==='ArrowRight')emit('next')
      });
    })();
  </script>
</body>
</html>
