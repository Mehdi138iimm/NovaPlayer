[package]
name = "nova-player"
version = "1.9.0"
description = "NOVA offline music player for Windows"
authors = ["NOVA"]
edition = "2021"

[lib]
name = "nova_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# update notification: GitHub Releases API + releases.atom fallback
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Perf: smaller, faster native binary (less RAM, quicker start)
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
