
def telegram(method, fields):
    request = urllib.request.Request(
        f"https://api.telegram.org/bot{token}/{method}",
        data=urllib.parse.urlencode(fields).encode("utf-8"),
        method="POST",
    )

    try:
        with urllib.request.urlopen(request, timeout=30) as response:
            result = json.loads(response.read().decode("utf-8"))

    except urllib.error.HTTPError as error:
        response_body = error.read().decode("utf-8", errors="replace")
        try:
            result = json.loads(response_body)
        except json.JSONDecodeError:
            result = {"description": response_body}

        raise RuntimeError(
            f"Telegram API HTTP {error.code}: "
            f"{result.get('description', result)}"
        ) from error

    except urllib.error.URLError as error:
        raise RuntimeError(
            f"Cannot reach Telegram API: {error.reason}"
        ) from error

    if not result.get("ok"):
        raise RuntimeError(
            f"Telegram API error: {result.get('description', result)}"
        )

    return result["result"]
