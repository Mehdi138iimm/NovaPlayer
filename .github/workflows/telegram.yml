
name: Notify Telegram

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send message to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          RELEASE_TAG: ${{ github.event.release.tag_name || 'تست دستی' }}
          RELEASE_BODY: ${{ github.event.release.body || 'این یک پیام آزمایشی است.' }}

        run: |
          set -euo pipefail

          MESSAGE=$(printf '🎵 NovaPlayer %s منتشر شد!\n\n%s\n\n▶️ اجرای آنلاین: https://mehdi138iimm.github.io/NovaPlayer/' "$RELEASE_TAG" "$RELEASE_BODY")

          curl --fail-with-body --silent --show-error \
            -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true"
