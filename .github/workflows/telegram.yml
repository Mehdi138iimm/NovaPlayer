
name: Notify Telegram

on:
  release:
    types: [published, deleted]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to resend, e.g. v1.17.0 (leave empty for a test)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nova-telegram-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Send Telegram notification
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          EVENT_ACTION: ${{ github.event.action || 'manual' }}
          RELEASE_ID: ${{ github.event.release.id || '' }}
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          RELEASE_URL: ${{ github.event.release.html_url || '' }}
          RELEASE_BODY: ${{ github.event.release.body || '' }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag || '' }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import json
          import urllib.request
          import urllib.parse
          import urllib.error

          token = os.environ.get("TG_TOKEN", "").strip()
          chat = os.environ.get("TG_CHAT", "").strip()
          action = os.environ.get("EVENT_ACTION", "manual")
          release_id = os.environ.get("RELEASE_ID", "")
          tag = os.environ.get("RELEASE_TAG", "")
          url = os.environ.get("RELEASE_URL", "")
          body = os.environ.get("RELEASE_BODY", "")
          repo = os.environ["REPOSITORY"]
          requested_tag = os.environ.get("RELEASE_TAG_INPUT", "").strip()
          gh_token = os.environ.get("GH_TOKEN", "")

          if not token or not chat:
              raise SystemExit(
                  "Missing TG_TOKEN or TG_CHAT. Check repository secrets."
              )

          def api_request(api_url, fields=None, headers=None):
              data = None
              if fields is not None:
                  data = urllib.parse.urlencode(fields).encode("utf-8")
              request = urllib.request.Request(
                  api_url, data=data, headers=headers or {}, method="POST"
                  if data is not None else "GET"
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  details = error.read().decode("utf-8", errors="replace")
                  try:
                      parsed = json.loads(details)
                      details = parsed.get("description", details)
                  except json.JSONDecodeError:
                      pass
                  raise RuntimeError(
                      f"HTTP {error.code}: {details}"
                  ) from error
              except urllib.error.URLError as error:
                  raise RuntimeError(
                      f"Network error: {error.reason}"
                  ) from error

          def telegram(method, fields):
              result = api_request(
                  f"https://api.telegram.org/bot{token}/{method}", fields
              )
              if not result.get("ok"):
                  raise RuntimeError(
                      "Telegram API rejected request: "
                      + str(result.get("description", result))
                  )
              return result["result"]

          # Manual run with a tag resends that existing GitHub release.
          if action == "manual" and requested_tag:
              api_url = (
                  f"https://api.github.com/repos/{repo}/releases/tags/"
                  + urllib.parse.quote(requested_tag, safe="")
              )
              result = api_request(
                  api_url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {gh_token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "NOVA-Player-Telegram-Notifier",
                  },
              )
              release_id = str(result["id"])
              tag = result["tag_name"]
              url = result["html_url"]
              body = result.get("body") or ""
              action = "published"

          if action == "deleted":
              print(
                  "Release deleted. Automatic Telegram message deletion "
                  "requires a saved message_id mapping."
              )
              raise SystemExit(0)

          if action not in ("published", "manual"):
              raise SystemExit(f"Unsupported event action: {action}")

          if action == "manual":
              tag = "تست دستی"
              url = f"https://github.com/{repo}/releases"
              body = "این یک پیام آزمایشی از NOVA Player است."

          if not url:
              url = f"https://github.com/{repo}/releases/tag/{tag}"

          body = re.sub(r"<!--.*?-->", "", body, flags=re.S)
          body = re.sub(r"(?m)^\s{0,3}#{1,6}\s+", "", body)
          body = re.sub(r"!\[([^\]]*)\]\([^)]+\)", r"\1", body)
          body = re.sub(r"\[([^\]]+)\]\((https?://[^)]+)\)", r"\1", body)
          body = re.sub(r"(\*\*|__|~~|`)", "", body)
          body = re.sub(r"(?m)^\s*[-*+]\s+", "• ", body)
          body = re.sub(r"\n{3,}", "\n\n", body).strip()

          if not body:
              body = "جزئیات این نسخه هنوز ثبت نشده است."

          site = "https://mehdi138iimm.github.io/NovaPlayer/"
          message = (
              "🎵 NOVA PLAYER\n"
              "━━━━━━━━━━━━━━\n\n"
              f"🚀 نسخهٔ جدید {tag} منتشر شد!\n\n"
              f"📝 تغییرات نسخه:\n\n{body}\n\n"
              "━━━━━━━━━━━━━━\n"
              f"🔗 مشاهدهٔ نسخه و فایل‌های انتشار:\n{url}\n\n"
              f"🌐 سایت رسمی NOVA Player:\n{site}"
          )

          # Telegram sendMessage text limit is 4096 characters.
          if len(message) > 3900:
              message = (
                  "🎵 NOVA PLAYER\n"
                  "━━━━━━━━━━━━━━\n\n"
                  f"🚀 نسخهٔ جدید {tag} منتشر شد!\n\n"
                  f"📝 تغییرات نسخه:\n\n{body[:2600]}\n\n"
                  "… ادامهٔ تغییرات در صفحهٔ انتشار:\n"
                  f"{url}\n\n🌐 سایت رسمی:\n{site}"
              )

          sent = telegram("sendMessage", {
              "chat_id": chat,
              "text": message,
              "disable_web_page_preview": "true"
          })

          print(
              f"SUCCESS: Telegram message sent for {tag}; "
              f"message_id={sent['message_id']}"
          )
          PY
